<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        h1 { color: #4CAF50; text-align: center; margin-top: 50px; font: size 1000px; ;}
        #first { color: #5d0202; text-align: center; font-size: 30px; font-weight: bold; }
        #Second {text-align: center; font-size: medium;}
        h2 { color: rgb(67, 67, 168); text-align: left;font-size: 20px; background-color: bisque;}    
    </style>
</head>
<body>
    <h1>Welcome to My GitHub Page!</h1>
    <p id="first">Type Of Input</p>
    <h2>Text</h2>
    <label for="username">User_name</label>
    <input type="text" id="username" name="username" required>
    <h2>Password</h2>
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" required>
    <h2>ُEmail</h2>
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" required>
    <h2>TelPhone number</h2>
    <label for="phone">رقم الهاتف:</label>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890">
    <h2>Numbers</h2>
    <label for="age">العمر</label>
    <input type="number" id="age" name="age" min="18" max="99">
    <h2>Date</h2>
    <label for="birthdate">تاريخ الميلاد</label>
    <input type="date" id="birthdate" name="birthdate">
    <h2>Radio</h2>
    <p>اختر الجنس</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">ذكر</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">أنثى</label>
    <h2>checkbox</h2>
    <p>اختر اهتماماتك</p>
    <input type="checkbox" id="sports" name="hobby" value="sports">
    <label for="sports">رياضة</label>
    <input type="checkbox" id="music" name="hobby" value="music">
    <label for="music">موسيقى</label>
    <h2>Select</h2>
    <label for="country">اختر دولتك:</label>
    <select id="country" name="country">
        <option value="EG">مصر</option>
        <option value="SA">السعودية</option>
        <option value="AE">الإمارات</option>
    </select>
    <h2>Textarea</h2>
    <label for="message">أدخل رسالتك</label><br>
    <textarea id="message" name="message" rows="4" cols="50">
    </textarea>
    <h2>hidden</h2>
    <form action="process.php" method="POST">
    <input type="hidden" name="user_id" value="12345">
    <label for="name">الاسم:</label>
    <input type="text" id="name" name="username">
    <button type="submit">إرسال</button>
    </form>
    <h2>URL</h2>       
    <label for="www"></label>
    <input type="url" id="www" name="website" placeholder="Url">
    <h2>Button</h2>           
    <button type="submit">إرسال البيانات</button>
    <button type="reset">إعادة تعيين</button>
    <button type="button">أي وظيفة افتراضية</button>
    <button acceskey="s">اضغط  Alt + S</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>

    <h1 id="title">Community Feedback Survey</h1>
    <p id="description">Please take a moment to help us improve our services.</p>

    <form id="survey-form">
        
        <div>
            <label id="name-label" for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div>
            <label id="email-label" for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
        </div>

        <div>
            <label id="number-label" for="number">Age (optional):</label>
            <input type="number" id="number" min="10" max="100" placeholder="Age (10-100)">
        </div>

        <div>
            <label for="dropdown">Which option best describes your current role?</label>
            <select id="dropdown">
                <option value="" disabled selected>Select current role</option>
                <option value="student">Student</option>
                <option value="job">Full-Time Job</option>
                <option value="learner">Prefer not to say</option>
            </select>
        </div>

        <div>
            <p>Would you recommend us to a friend?</p>
            <label>
                <input type="radio" name="recommend" value="definitely" checked> Definitely
            </label>
            <label>
                <input type="radio" name="recommend" value="maybe"> Maybe
            </label>
            <label>
                <input type="radio" name="recommend" value="not-sure"> Not sure
            </label>
        </div>

        <div>
            <p>What would you like to see improved? (Check all that apply)</p>
            <label>
                <input type="checkbox" value="front-end"> Front-end Projects
            </label>
            <label>
                <input type="checkbox" value="back-end"> Back-end Projects
            </label>
            <label>
                <input type="checkbox" value="data-visualization"> Data Visualization
            </label>
        </div>

        <div>
            <p>Any comments or suggestions?</p>
            <textarea placeholder="Enter your comment here..."></textarea>
        </div>

        <div>
            <button type="submit" id="submit">Submit</button>
        </div>

    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
<h1>Checkout</h1>
<section>
    <h2>Your Cart</h2>
    <image scr="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="مكعب ثلاثي الأبعاد ملون يظهر زوايا هندسية مختلفة على خلفية بيضاء">
</section>
<section>
    <h2>Payment Information</h2>
    <form>

    <label for="card-name">Card-Name<span aria-hidden="true">*</span></label>
    <input type="text" name="card-name" id="card-name" required />
    
    <label for="card-number">Card-Namber <span aria-hidden="true">*</span></label>
        <input 
    type="text" 
    id="card-number" 
    name="card-number" 
    required 
    aria-describedby="card-number-help"/>
    <p id="card-number-help">Please enter the 16-digit card number without spaces or hyphens.</p>
    </form>
</section>

</body>

</html>
